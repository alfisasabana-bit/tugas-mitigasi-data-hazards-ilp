
# ============================================================
# RAW (READ AFTER WRITE) HAZARD SIMULATOR
# Analisis Dependensi dan Visualisasi Grafik RAW
# ============================================================

from dataclasses import dataclass
import matplotlib.pyplot as plt
import networkx as nx


# ============================================================
# 1. DEFINISI INSTRUKSI
# ============================================================

@dataclass
class Instruction:
    name: str
    destination: str
    sources: list


# ============================================================
# 2. INSTRUCTION SET
# ============================================================

instructions = [
    Instruction("I1", "R1", ["R2", "R3"]),
    Instruction("I2", "R4", ["R1", "R5"]),
    Instruction("I3", "R6", ["R4", "R7"]),
    Instruction("I4", "R8", ["R9", "R10"]),
]


# ============================================================
# 3. PEMERIKSAAN DEPENDENSI RAW
# ============================================================

def has_raw_dependency(inst1, inst2):
    return inst1.destination in inst2.sources


# ============================================================
# 4. ANALISIS DEPENDENSI RAW
# ============================================================

def show_raw(instructions):

    print("=" * 60)
    print("RAW (READ AFTER WRITE) DEPENDENCY ANALYSIS")
    print("=" * 60)

    graph = nx.DiGraph()
    dependencies = []

    for inst in instructions:
        label = (
            f"{inst.name}\n"
            f"{inst.destination} = "
            f"{' + '.join(inst.sources)}"
        )
        graph.add_node(inst.name, label=label)

    for i in range(len(instructions)):
        for j in range(i + 1, len(instructions)):

            first = instructions[i]
            second = instructions[j]

            if has_raw_dependency(first, second):
                dependencies.append(
                    (first.name, second.name, first.destination)
                )

                graph.add_edge(
                    first.name,
                    second.name,
                    register=first.destination
                )

                print(
                    f"{first.name} -> {second.name}: "
                    f"RAW pada register {first.destination}"
                )

    print("\nDaftar Instruksi:")

    for inst in instructions:
        print(
            f"{inst.name}: {inst.destination} = "
            f"{' + '.join(inst.sources)}"
        )

    print(f"\nTotal dependensi RAW: {len(dependencies)}")

    # ========================================================
    # 5. GRAFIK 1: DEPENDENCY GRAPH
    # ========================================================

    pos = {
        "I1": (0, 1),
        "I2": (2, 1),
        "I3": (4, 1),
        "I4": (2, -1)
    }

    labels = nx.get_node_attributes(graph, "label")

    plt.figure(figsize=(12, 5))

    nx.draw_networkx_nodes(
        graph, pos,
        node_color="lightblue",
        node_shape="s",
        node_size=5000,
        edgecolors="black"
    )

    nx.draw_networkx_labels(
        graph, pos,
        labels=labels,
        font_size=9,
        font_weight="bold"
    )

    nx.draw_networkx_edges(
        graph, pos,
        arrows=True,
        arrowstyle="-|>",
        arrowsize=25,
        edge_color="black",
        width=1.8,
        node_size=5000
    )

    edge_labels = {
        (source, target): data["register"]
        for source, target, data in graph.edges(data=True)
    }

    nx.draw_networkx_edge_labels(
        graph, pos,
        edge_labels=edge_labels,
        font_size=10,
        font_color="red"
    )

    plt.title("RAW Dependency Graph")
    plt.xlim(-1.5, 5.5)
    plt.ylim(-2, 2)
    plt.axis("off")
    plt.tight_layout()
    plt.savefig("raw_dependency_graph.png", dpi=300, bbox_inches="tight")
    plt.show()

    # ========================================================
    # 6. GRAFIK 2: JUMLAH DEPENDENSI PER REGISTER
    # ========================================================

    register_counts = {}

    for source, target, register in dependencies:
        register_counts[register] = (
            register_counts.get(register, 0) + 1
        )

    plt.figure(figsize=(8, 5))

    plt.bar(
        list(register_counts.keys()),
        list(register_counts.values())
    )

    plt.title("Jumlah Dependensi RAW per Register")
    plt.xlabel("Register Penyebab Dependensi")
    plt.ylabel("Jumlah Dependensi")
    plt.yticks(range(0, max(register_counts.values(), default=0) + 2))
    plt.grid(axis="y", linestyle="--", alpha=0.4)
    plt.tight_layout()
    plt.savefig("raw_dependency_per_register.png", dpi=300)
    plt.show()

    # ========================================================
    # 7. GRAFIK 3: KETERLIBATAN INSTRUKSI DALAM DEPENDENSI
    # ========================================================

    involvement = {inst.name: 0 for inst in instructions}

    for source, target, register in dependencies:
        involvement[source] += 1
        involvement[target] += 1

    plt.figure(figsize=(8, 5))

    plt.bar(
        list(involvement.keys()),
        list(involvement.values())
    )

    plt.title("Keterlibatan Instruksi dalam Dependensi RAW")
    plt.xlabel("Instruksi")
    plt.ylabel("Jumlah Hubungan Dependensi")
    plt.yticks(range(0, max(involvement.values(), default=0) + 2))
    plt.grid(axis="y", linestyle="--", alpha=0.4)
    plt.tight_layout()
    plt.savefig("raw_instruction_involvement.png", dpi=300)
    plt.show()

    # ========================================================
    # 8. INFORMASI FILE GRAFIK
    # ========================================================

    print("\nFile grafik berhasil disimpan:")
    print("1. raw_dependency_graph.png")
    print("2. raw_dependency_per_register.png")
    print("3. raw_instruction_involvement.png")


# ============================================================
# 9. MENJALANKAN PROGRAM
# ============================================================

if __name__ == "__main__":
    show_raw(instructions)
